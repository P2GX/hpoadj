name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B package
      - uses: softprops/action-gh-release@v2
        with:
          name: hpoadj ${{ github.ref_name }}
          files: hpoadj-cli/target/hpoadj-*.jar
          generate_release_notes: true
